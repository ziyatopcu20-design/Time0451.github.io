<!DOCTYPE html>
<html lang="tr">
<head>

    <style>

        .donate-btn { display: inline-block; margin-top: 30px; padding: 12px 24px; background: #ff5f5f; color: white; text-decoration: none; font-weight: bold; border-radius: 25px; }
    </style>
</head>
<body>

    <h1>Çizim Galerim</h1>
    <p>Kendi yaptığım çizimleri burada paylaşıyorum.</p>

    <div class="gallery">
        <img src="cizim1.jpg" alt="Çizim 1">
        <img src="cizim2.jpg" alt="Çizim 2">
    </div>

    <br>

    <a href="https://ko-fi.com/KULLANICI_ADINIZ" class="donate-btn" target="_blank">☕ Bana Destek Ol (Ko-fi)</a>
